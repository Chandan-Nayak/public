<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Viewer</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --toolbar-bg: #f5f5f5;
        --toolbar-border: #ddd;
      }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      .toolbar {
        display: none !important;
      }
      .toolbar button { display: none; }
      .pages {
        width: 100%;
        margin: 0;
        padding: 0;
      }
      .page {
        width: 100%;
        margin: 0 auto 1rem auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        border-radius: 8px;
        overflow: hidden;
        background: white;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.js"></script>
    <script>
      // Configure PDF.js worker
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.js";

      const qs = new URLSearchParams(location.search);
      const fileUrl = qs.get('file') || '/static/resume.pdf';
      const zoomParam = parseFloat(qs.get('zoom') || '1.35');
      const showToolbar = qs.get('toolbar') !== '0';
      let pdfDoc = null;
      let scale = 1.0; // base scale before fit-to-width calculation
      let baseViewportWidth = null; // will be set from first page

      async function loadPdf() {
        const loadingTask = pdfjsLib.getDocument(fileUrl);
        pdfDoc = await loadingTask.promise;
        await renderAllPages();
      }

      async function renderPage(pageNum) {
        const container = document.querySelector('.pages');
        let pageWrapper = container.querySelector(`[data-page='${pageNum}']`);
        if (!pageWrapper) {
          pageWrapper = document.createElement('div');
          pageWrapper.className = 'page';
          pageWrapper.dataset.page = String(pageNum);
          const canvas = document.createElement('canvas');
          pageWrapper.appendChild(canvas);
          container.appendChild(pageWrapper);
        }
        const canvas = pageWrapper.querySelector('canvas');
        const ctx = canvas.getContext('2d');

        const page = await pdfDoc.getPage(pageNum);
        const initialViewport = page.getViewport({ scale: 1.0 });
        if (!baseViewportWidth) {
          baseViewportWidth = initialViewport.width;
        }
        const containerWidth = document.querySelector('.pages').clientWidth;
        const fitWidthScale = containerWidth / baseViewportWidth;
        const viewport = page.getViewport({ scale: fitWidthScale * scale * zoomParam });

        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        const renderContext = { canvasContext: ctx, viewport };
        await page.render(renderContext).promise;
      }

      async function renderAllPages() {
        const numPages = pdfDoc.numPages;
        // Clear current pages
        const container = document.querySelector('.pages');
        container.innerHTML = '';
        for (let i = 1; i <= numPages; i++) {
          await renderPage(i);
        }
      }

      function zoomIn() { scale *= 1.15; renderAllPages(); }
      function zoomOut() { scale /= 1.15; renderAllPages(); }
      function resetZoom() { scale = 1.0; renderAllPages(); }

      window.addEventListener('resize', () => {
        // Re-render on resize for fit-to-width behavior
        if (pdfDoc) renderAllPages();
      });

      window.addEventListener('DOMContentLoaded', () => {
        if (!showToolbar) {
          const tb = document.querySelector('.toolbar');
          if (tb) tb.style.display = 'none';
        }
        document.getElementById('zoomIn')?.addEventListener('click', zoomIn);
        document.getElementById('zoomOut')?.addEventListener('click', zoomOut);
        document.getElementById('resetZoom')?.addEventListener('click', resetZoom);
        loadPdf().catch(err => {
          console.error('Failed to load PDF:', err);
          const container = document.querySelector('.pages');
          container.innerHTML = `<p>Error loading PDF. <a href="${fileUrl}">Open directly</a></p>`;
        });
      });
    </script>
  </head>
  <body>
    <div class="toolbar">
      <button id="zoomOut" title="Zoom Out">−</button>
      <button id="resetZoom" title="Reset Zoom">100%</button>
      <button id="zoomIn" title="Zoom In">+</button>
    </div>
    <div class="pages" aria-label="PDF pages"></div>
  </body>
</html>
